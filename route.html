<style>
:root{--primary:#0f766e;--accent:#14b8a6;--success:#22c55e;--danger:#ef4444;--bg:#060d14;--glass:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.10);--text:#e6eef8;--muted:#8aa0b8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',sans-serif;background:radial-gradient(900px 600px at 80% -10%, rgba(20,184,166,0.18), transparent 60%),linear-gradient(180deg,#060d14 0%,#0a1628 100%);color:var(--text);height:100dvh;display:flex;flex-direction:column;overflow:hidden}

.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--primary),var(--accent));display:flex;align-items:center;justify-content:center}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--glass);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn.primary{background:linear-gradient(135deg,var(--primary),var(--accent));border:none}

.stats{flex-shrink:0;display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px 8px}

.stat-number{font-family:'Geist';font-size:15px;font-weight:700}

.map-container{flex:1;position:relative;overflow:auto;-webkit-overflow-scrolling:touch}

.point{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;z-index:10;cursor:pointer;max-width:94vw}

.point-avatar{width:22px;height:22px;border-radius:6px;flex-shrink:0;background:linear-gradient(135deg,#1e293b,#0f172a);display:flex;align-items:center;justify-content:center;font-family:'Geist';font-weight:700;font-size:10px}
.point-avatar.current{background:linear-gradient(135deg,#22c55e,#0f766e)}

.point-name{font-weight:600;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.point-meta{font-size:8px;color:var(--muted);margin-top:1px}

.point-dot{width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Geist';font-weight:700;font-size:9px;flex-shrink:0;margin:0 4px}
.point-dot.current{background:linear-gradient(135deg,#3b82f6,#2563eb);color:white}
.point-dot.pending{background:rgba(51,65,85,0.9);color:#94a3b8}
.point-dot.refused{background:linear-gradient(135deg,#ef4444,#dc2626);color:white}
.premium-terminal{position:absolute;transform:translate(-50%,-50%);z-index:20;display:flex;flex-direction:column;align-items:center}

.terminal-icon{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px}

.sidebar-content{flex:1;overflow-y:auto;padding:6px}

.client-modal{position:fixed;inset:0;z-index:300;background:rgba(0,0,0,0.6);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;padding:14px}

.modal-card{width:100%;max-width:360px;background:linear-gradient(180deg,rgba(22,34,51,0.97),rgba(10,20,34,0.99));border:1px solid rgba(255,255,255,0.11);border-radius:16px;backdrop-filter:blur(28px);overflow:hidden}
.modal-header{padding:14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.modal-body{padding:8px;display:grid;gap:6px}
.modal-action{display:flex;align-items:center;gap:10px;padding:10px 11px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:10px;cursor:pointer;font-size:11.5px;font-weight:500}
.dialog-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(16px);z-index:400;display:none;align-items:center;justify-content:center;padding:16px}
.dialog-overlay.active{display:flex}
.dialog-card{width:100%;max-width:340px;background:linear-gradient(180deg,rgba(22,34,51,0.98),rgba(10,20,34,0.99));border:1px solid rgba(255,255,255,0.12);border-radius:18px;backdrop-filter:blur(28px);overflow:hidden}
.dialog-header{padding:18px 16px 12px;text-align:center}
.dialog-icon{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-size:18px}
.dialog-icon.danger{background:rgba(239,68,68,0.12);color:#f87171}
.dialog-icon.warning{background:rgba(245,158,11,0.12);color:#fbbf24}
.dialog-icon.success{background:rgba(34,197,94,0.12);color:#4ade80}
.dialog-icon.info{background:rgba(59,130,246,0.12);color:#60a5fa}
.dialog-title{font-weight:800;font-size:13px}
.dialog-message{font-size:11px;color:var(--muted);margin-top:6px;line-height:1.6;white-space:pre-line}
.dialog-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;border-top:1px solid var(--border)}
.dialog-btn{padding:10px;border-radius:10px;border:none;font-weight:700;font-size:11.5px;cursor:pointer;font-family:'Cairo'}
.dialog-btn.cancel{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--border)}
.dialog-btn.confirm{background:linear-gradient(135deg,var(--primary),var(--accent));color:white}
.toast-container{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:500;display:flex;flex-direction:column;gap:8px;pointer-events:none;width:90%;max-width:340px}
.toast{pointer-events:auto;background:rgba(22,34,51,0.97);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600}
.toast.success{border-color:rgba(34,197,94,0.2)} .toast.error{border-color:rgba(239,68,68,0.2)}
.dialog-box{background:linear-gradient(180deg,rgba(22,34,51,0.98),rgba(10,20,34,0.99));border-radius:18px;padding:18px;width:100%;max-width:340px;border:1px solid rgba(255,255,255,0.12)}
.dialog-input{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,0.06);color:var(--text);font-family:'Cairo';margin-top:10px;font-size:13px}
</style>
</head>

<div class="header">
  <div style="display:flex;gap:6px">
    <button class="icon-btn" onclick="toggleSidebar()"><i class="fa-solid fa-bars-staggered" style="font-size:12px"></i></button>

fa-solid fa-eye" style="font-size:11px"></i></i><span>عرض التفاصيل</span></div><div class="modal-action" onclick="callClient()"><i style="width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(20,184,166,0.12);color:#2dd4bf"><i class="fa-solid fa-phone" style="font-size:11px"></i></i><span>اتصال</span></div><div class="modal-action" onclick="whatsappClient()"><i style="width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:rgba(34,197,94,0.12);color:#4ade80"><i class="fa-brands fa-whatsapp" style="font-size:11px"></i></i><span>واتساب</span></div></div></div></div>

<div class="dialog-overlay" id="appDialog" onclick="if(event.target===this) closeAppDialog(false)"><div class="dialog-card"><div class="dialog-header"><div class="dialog-icon" id="dialogIcon"><i class="fa-solid fa-circle-question"></i></div><div class="dialog-title" id="dialogTitle">تأكيد</div><div class="dialog-message" id="dialogMessage">هل أنت متأكد؟</div></div><div class="dialog-actions"><button class="dialog-btn cancel" id="dialogCancelBtn" onclick="closeAppDialog(false)">إلغاء</button><button class="dialog-btn confirm" id="dialogConfirmBtn" onclick="closeAppDialog(true)">تأكيد</button></div></div></div>

<script type="module">
import { auth, db } from "./firebase.js";
import { ref, onValue, set, get, update } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
let allCustomers = {};
let routeList = [];
let filteredList = [];
let selectedRealIndex = null;
let selectedFilteredIndex = null;
let currentUid = null;
let customersRef = null;
let routeRef = null;
const getId = (item) => window.KarniShared ? KarniShared.getId(item) : (item.customerId || item.id);
const getRealBalance = (c) => window.KarniShared ? KarniShared.getRealBalance(c) : 0;
const isBlocked = (n) => window.KarniShared ? KarniShared.isBlocked(n) : false;
const isDueTodayFromIndex = (c) => window.KarniShared ? KarniShared.isDueToday(c) : false;
let customersLoaded=false, routeLoaded=false, rawRouteData=null, isMerging=false, isSaving=false;
let dialogResolve=null, dialogMode='confirm';
function openCustomDialog({title='تأكيد', message='', icon='money-bill-wave', iconType='success', inputValue='', inputType='text', placeholder='', showInput=false, showDate=false, confirmText='تأكيد', cancelText='إلغاء', danger=false}){
  return new Promise(resolve=>{
    dialogResolve=resolve;
    document.getElementById('customDialogTitle').textContent=title;
    document.getElementById('customDialogMsg').textContent=message;
    document.getElementById('customDialogMsg').style.display=message?'block':'none';
    const iconEl=document.getElementById('customDialogIcon');
    iconEl.className='dialog-icon '+iconType;
    iconEl.innerHTML=`<i class="fa-solid fa-${icon}"></i>`;
    const inputEl=document.getElementById('customDialogInput');
    const dateEl=document.getElementById('customDialogDate');
    if(showInput){ inputEl.style.display='block'; inputEl.type=inputType; inputEl.value=inputValue; inputEl.placeholder=placeholder; setTimeout(()=>inputEl.focus(),100); dialogMode='input'; } else { inputEl.style.display='none'; }
    if(showDate){ dateEl.style.display='block'; dateEl.value=inputValue||new Date().toISOString().split('T')[0]; dialogMode='date'; } else { dateEl.style.display='none'; }
    if(!showInput && !showDate) dialogMode='confirm';
    document.getElementById('customDialogConfirm').textContent=confirmText;
    document.getElementById('customDialogConfirm').className='dialog-btn confirm'+(danger?' danger':'');
    document.getElementById('customDialogCancel').textContent=cancelText;
    document.getElementById('customDialog').classList.add('active');
  });
}
function closeCustomDialog(result){ document.getElementById('customDialog').classList.remove('active'); if(dialogResolve){ dialogResolve(result); dialogResolve=null; } }
document.getElementById('customDialogCancel').onclick=()=>closeCustomDialog(null);
document.getElementById('customDialogConfirm').onclick=()=>{
  const inputEl=document.getElementById('customDialogInput');
  const dateEl=document.getElementById('customDialogDate');
  if(dialogMode==='input' && inputEl.style.display!=='none') closeCustomDialog(inputEl.value);
  else if(dialogMode==='date' && dateEl.style.display!=='none') closeCustomDialog(dateEl.value);
  else closeCustomDialog(true);
};
document.getElementById('customDialog').addEventListener('click',(e)=>{ if(e.target===e.currentTarget) closeCustomDialog(null); });
let appDialogResolve=null;
function openAppDialog({title='تأكيد', message='', confirmText='تأكيد', cancelText='إلغاء', type='info', danger=false}){
  return new Promise(resolve=>{
    appDialogResolve=resolve;
    document.getElementById('dialogTitle').textContent=title;
    document.getElementById('dialogMessage').textContent=message;
    document.getElementById('dialogCancelBtn').textContent=cancelText;
    const confirmBtn=document.getElementById('dialogConfirmBtn');
    confirmBtn.textContent=confirmText;
    confirmBtn.className='dialog-btn confirm' + (danger?' danger':'');

    iconEl.className='dialog-icon ' + type;

function tryBuildRoute(){
  if(!customersLoaded || !routeLoaded) return;
  if(isMerging) return;
  isMerging=true;
  try{
    if(rawRouteData!==null){
      if(Array.isArray(rawRouteData)) routeList=rawRouteData;
      else if(typeof rawRouteData==='object') routeList=Object.values(rawRouteData);
      else routeList=[];
      routeList=routeList.filter(i=>i && !isBlocked(i.name));
      rawRouteData=null;
    }
    mergeTodayIntoRoute();
  } finally { isMerging=false; }
}
onAuthStateChanged(auth, (user)=>{
  if(!user){ window.location.href='login.html'; return; }
  currentUid = user.uid;
  customersRef = ref(db, `users/${currentUid}/customers`);
  routeRef = ref(db, `users/${currentUid}/routeManual`);
  onValue(customersRef, (snapshot)=>{
    let data = snapshot.val() || {};
    if(data._init) delete data._init;
    Object.keys(data).forEach(k=>{ if(data[k] && data[k]._init && Object.keys(data[k]).length===1){ delete data[k]; } });
    allCustomers = data;
    customersLoaded=true;
    tryBuildRoute();
  });
  onValue(routeRef, (snapshot)=>{
    if(isSaving) return;
    if(snapshot.exists()) rawRouteData=snapshot.val();
    else rawRouteData=[];
    routeLoaded=true;
    tryBuildRoute();
  });
});
function getTodayCustomers(){
  const todayCustomers = [];
  Object.keys(allCustomers).forEach(key=>{
    const c = allCustomers[key];
    if(isDueTodayFromIndex(c)){
      todayCustomers.push({ id:key, customerId:key, name:c.name, phone:c.phone||'', city:c.city||c.ville||'', debt:getRealBalance(c), amount:getRealBalance(c), date:c.date, status:'pending' });
    }
  });
  todayCustomers.sort((a,b)=> (a.city||'').localeCompare(b.city||'') || a.name.localeCompare(b.name));
  return todayCustomers;
}
function normalizeCurrent(){
  const currents = routeList.filter(i=>i.status==='current' && !isBlocked(i.name));
  if(currents.length===0){
    const firstPending=routeList.find(i=>i.status==='pending');
    if(firstPending) firstPending.status='current';
  } else if(currents.length>1){
    let first=true;
    routeList.forEach(item=>{ if(item.status==='current'){ if(first) first=false; else item.status='pending'; } });
  }
}
function mergeTodayIntoRoute(){
  const todayCustomers = getTodayCustomers();
  const existingIds = new Set(routeList.map(i=>getId(i)).filter(Boolean));
  const todayIds = new Set(todayCustomers.map(i=>getId(i)).filter(Boolean));
  todayCustomers.forEach(c=>{
    const cid=getId(c);
    if(!existingIds.has(cid)){ routeList.push(c); existingIds.add(cid); }
  });
  // لا تحذف إلا إذا لم يعد الزبون موجوداً في قاعدة البيانات - لا تعتمد فقط على isDueToday
  routeList = routeList.filter(item=>{
    if(!item) return false;
    if(isBlocked(item.name)) return false;
    const id=getId(item);
    if(!id) return false;
    // إذا لم يعد موجوداً في allCustomers -> احذف
    if(!allCustomers[id]) return false;
    if(todayIds.has(id)) return true;
    // احتفظ بجميع الحالات الموجودة - لا تحذف pending/current بسبب التاريخ
    return true;
  });
  const seen=new Set();
  routeList=routeList.filter(item=>{
    const id=getId(item);
    if(!id) return false;
    if(seen.has(id)) return false;
    seen.add(id); return true;
  });
  normalizeCurrent();
  applyFilter();
}
window.buildRouteFromToday = async function(forceReplace=false){
  if(!currentUid || !customersRef || !routeRef) return;
  if(!customersLoaded) return;
  const todayCustomers = getTodayCustomers();
  if(todayCustomers.length>0) todayCustomers[0].status='current';
  if(forceReplace || routeList.length===0) routeList=todayCustomers;
  else {
    const existingMap=new Map(routeList.map(i=>[getId(i), i]));
    todayCustomers.forEach(c=>{ if(!existingMap.has(getId(c))) routeList.push(c); });
    if(routeList.length===0) routeList=todayCustomers;
  }
  normalizeCurrent();
  isSaving=true; await set(routeRef, routeList); setTimeout(()=>{ isSaving=false; },500);
  applyFilter();
}
window.syncFromIndex = async function(){
  if(!currentUid || !customersRef || !routeRef) return;
  if(!customersLoaded){ showToast('جاري تحميل الزبناء...','info'); return; }
  const todayCustomers = getTodayCustomers();
  const existingMap = new Map(routeList.map(i=>[getId(i), i]));
  let newCount=0;
  let updatedCount=0;
  todayCustomers.forEach(c=>{
    const cid=getId(c);
    const existing = existingMap.get(cid);
    if(!existing){
      routeList.push(c);
      newCount++;
    } else {
      // تحديث بيانات الزبون الموجود من allCustomers
      existing.name = c.name;
      existing.phone = c.phone;
      existing.city = c.city;
      existing.debt = c.debt;
      existing.amount = c.amount;
      existing.date = c.date;
      if(existing.status!=='current' && existing.status!=='refused') {
        // لا نغير الحالة إذا كان current/refused
      }
      updatedCount++;
    }
  });
  normalizeCurrent();
  isSaving=true; await set(routeRef, routeList); isSaving=false;
  applyFilter();
  showToast(`تمت المزامنة: ${todayCustomers.length} زبون، ${newCount} جديد، ${updatedCount} محدث`, 'success');
}
function applyFilter(){
  const finalList=[];
  const allSeen=new Set();
  routeList.forEach(item=>{
    const id=getId(item);
    if(!id || allSeen.has(id)) return;
    if(['pending','current','refused'].includes(item.status) && !isBlocked(item.name)){
      allSeen.add(id); finalList.push(item);
    }
  });
  filteredList = finalList;
  renderMap(); renderSidebar();
}

function reorder(from,to){
  if(!routeRef || !currentUid) return;
  const arr=[...filteredList]; const [m]=arr.splice(from,1); arr.splice(to,0,m); filteredList=arr;
  // إعادة ترتيب تؤثر فقط على الزبناء الظاهرين وتحافظ على بقية العناصر
  const visibleIds = new Set(filteredList.map(i=>getId(i)));
  const reorderedMap = new Map(filteredList.map((item, idx)=>[getId(item), item]));
  let visiblePointer=0;
  const newRoute = routeList.map(item=>{
    const id=getId(item);
    if(visibleIds.has(id)){
      const newItem = filteredList[visiblePointer];
      visiblePointer++;
      return newItem;
    }
    return item;
  });
  // إذا كان هناك عناصر ظاهرة جديدة لم تكن في routeList (نادر)
  filteredList.forEach(item=>{
    if(!newRoute.some(r=>getId(r)===getId(item))){
      newRoute.push(item);
    }
  });
  routeList=newRoute;
  renderMap(); renderSidebar();
  isSaving=true; set(routeRef, routeList).then(()=>{ isSaving=false; });
}

  selectedFilteredIndex = i;
  document.getElementById('modalClientName').innerText=item.name||'بدون';
  document.getElementById('modalClientMeta').innerText=`#${i+1} • ${getArabicStatus(item.status)} ${item.debt?'• '+item.debt+' درهم':''} ${item.city?'• '+item.city:''}`;
  document.getElementById('clientModal').classList.add('active');
}
window.closeModal = function(){ document.getElementById('clientModal').classList.remove('active'); }
window.openDetails = async function(){
  const item=filteredList[selectedFilteredIndex];
  await openAppDialog({title:item.name||'التفاصيل', message:`المدينة: ${item.city||'غير محدد'}\nالدين: ${item.debt||0} درهم\nالهاتف: ${item.phone||'لا يوجد'}\nالتاريخ: ${item.date||'غير محدد'}`, confirmText:'حسناً', cancelText:'إغلاق', type:'info'});
}
window.callClient = function(){
  const item=filteredList[selectedFilteredIndex];
  if(item.phone) window.location.href='tel:'+item.phone;
  else showToast('لا يوجد هاتف', 'error');
}
window.whatsappClient = function(){
  const item=filteredList[selectedFilteredIndex];
  if(item.phone) window.open('https://wa.me/'+item.phone.replace(/[^0-9]/g,''),'_blank');
  else showToast('لا يوجد واتساب', 'error');
}
window.toggleSidebar = function(){
  const s=document.getElementById('sidebar');
  const c=document.getElementById('sidebarChevron');
  s.classList.toggle('open');
  c.className=s.classList.contains('open')?'fa-solid fa-chevron-right':'fa-solid fa-chevron-left';
}
window.addEventListener('resize',()=>{ renderMap(); });
</script>
</body>
</html>
