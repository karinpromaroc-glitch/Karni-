<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات الزبائن - Karni Pro</title>
<script src="lang.js"></script>
<script>setTimeout(()=>{var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s);var l=document.createElement('link');l.rel='stylesheet';l.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css';document.head.appendChild(l);},80);</script>
</head>
<body class="bg-gray-50">
<header class="bg-white border-b sticky top-0 z-20"><div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center"><a href="matjar.html" class="w-9 h-9 bg-gray-100 rounded-xl flex items-center justify-center"><i class="fa-solid fa-arrow-right"></i></a><h1 class="font-bold">طلبات الزبائن</h1><div class="w-9"></div></div></header>
<main class="max-w-4xl mx-auto px-4 pt-4">
<div id="ordersList" class="space-y-3"></div>
<div id="empty" class="hidden text-center py-16"><i class="fa-solid fa-inbox text-4xl text-gray-300"></i><p class="text-gray-500 mt-2">لا توجد طلبات بعد</p></div>
</main>
<div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-[100]"><div class="bg-gray-900 text-white px-6 py-3 rounded-xl shadow-lg"><span id="toastMessage" class="text-sm"></span></div></div>
<script type="module">
import { auth, db } from "./firebase.js";
import { ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}

function showToast(msg){
  const t=document.getElementById('toast');
  if(!t) return;
  document.getElementById('toastMessage').textContent=msg;
  t.classList.remove('hidden');
  setTimeout(()=>t.classList.add('hidden'),3500);
}

// تحويل رقم مغربي إلى صيغة WhatsApp الصحيحة
function normalizePhone(raw){
  if(!raw) return null;
  let p = String(raw).replace(/[\s\-\(\)]/g,'').trim();
  if(p.startsWith('+')) p = p.slice(1);
  // إزالة أي رموز غير أرقام
  p = p.replace(/\D/g,'');
  if(!p) return null;
  if(p.startsWith('212')){
    // 212612345678 - صحيح
    if(p.length===12) return p;
    return p;
  }
  if(p.startsWith('0')){
    // 0612345678 -> 212612345678
    return '212' + p.slice(1);
  }
  // 612345678 -> 212612345678
  if(p.length===9 && /^[67]/.test(p)){
    return '212' + p;
  }
  if(p.length===10 && p.startsWith('0')){
    return '212' + p.slice(1);
  }
  return null;
}

function formatPay(method){
  return method==='cod'? 'الدفع عند الاستلام' : 'الدفع الآن';
}

let cachedOrders = []; // [{firebaseId,...data}]

onAuthStateChanged(auth, (user)=>{
  if(!user){ location.href='login.html'; return; }
  const ordersRef = ref(db, `users/${user.uid}/orders`);
  onValue(ordersRef, (snap)=>{
    const list = document.getElementById('ordersList');
    const empty = document.getElementById('empty');
    if(!snap.exists()){
      cachedOrders=[];
      list.innerHTML='';
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');
    // مهم جداً: استخدام Object.entries للحفاظ على المفتاح الحقيقي
    const entries = Object.entries(snap.val());
    cachedOrders = entries.map(([firebaseId, data])=>({
      firebaseId: firebaseId,
     ...data
    })).sort((a,b)=> new Date(b.createdAt||0)-new Date(a.createdAt||0));

    list.innerHTML = cachedOrders.map(o=>{
      const isAccepted = o.status==='accepted';
      const isDelivered = o.status==='delivered';
      const itemsHtml = (o.items||[]).map(i=>`<div class="flex justify-between"><span>${escapeHtml(i.name)} × ${i.qty}</span><span class="font-bold">${(parseFloat(i.price||0)*parseFloat(i.qty||0)).toFixed(2)}</span></div>`).join('');
      const statusClass = o.status==='new'? 'bg-red-100 text-red-600' : o.status==='pending'? 'bg-amber-100 text-amber-700' : o.status==='accepted'? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700';
      return `
      <div class="bg-white rounded-2xl border p-4">
        <div class="flex justify-between mb-2"><span class="font-bold">${escapeHtml(o.clientName||'زبون')} - ${escapeHtml(o.phone||'')}</span><span class="text-xs ${statusClass} px-2 py-1 rounded-full">${escapeHtml(o.status||'new')}</span></div>
        <p class="text-xs text-gray-500 mb-2">${o.createdAt? new Date(o.createdAt).toLocaleString('ar-MA') : ''} - ${escapeHtml(o.city||'')} - ${formatPay(o.paymentMethod)}</p>
        <div class="bg-gray-50 rounded-xl p-2 space-y-1 text-sm">${itemsHtml}</div>
        <div class="flex justify-between font-bold mt-2 pt-2 border-t"><span>الإجمالي</span><span class="text-emerald-600">${(parseFloat(o.totalValue||0)).toFixed(2)} درهم</span></div>
        <div class="text-[11px] text-gray-400 mt-1">📍 ${escapeHtml(o.address||'')} - ${escapeHtml(o.note||'')}</div>
        <div class="flex gap-2 mt-3">
          ${isAccepted?
            `<button disabled class="flex-1 bg-blue-100 text-blue-700 py-2 rounded-xl text-sm font-bold cursor-not-allowed"><i class="fa-solid fa-check ml-1"></i> ✓ تم قبول الطلب</button>` :
            isDelivered?
            `<button disabled class="flex-1 bg-emerald-100 text-emerald-700 py-2 rounded-xl text-sm font-bold cursor-not-allowed">✓ تم التوصيل</button>` :
            `<button onclick="acceptOrder('${o.firebaseId}')" id="btn-accept-${o.firebaseId}" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl text-sm font-bold transition">قبول</button>`
          }
          <button onclick="closeOrder('${o.firebaseId}')" ${isDelivered?'disabled':''} class="flex-1 ${isDelivered?'bg-gray-100 text-gray-400 cursor-not-allowed':'bg-gray-100 hover:bg-gray-200'} py-2 rounded-xl text-sm">تم التوصيل</button>
        </div>
      </div>
    `}).join('');
  }, (error)=>{
    console.error('[ORDERS] onValue error:', error);
    showToast('خطأ في تحميل الطلبات');
  });
});

window.acceptOrder = async (firebaseId)=>{
  try{
    const u = auth.currentUser;
    if(!u){
      showToast('يجب تسجيل الدخول');
      return;
    }
    if(!firebaseId){
      showToast('معرف الطلب غير موجود');
      return;
    }
    // ابحث عن الطلب في الكاش باستخدام المفتاح الحقيقي
    const order = cachedOrders.find(o=>o.firebaseId===firebaseId);
    if(!order){
      showToast('الطلب غير موجود');
      return;
    }
    // لا ترسل واتساب إذا مقبول مسبقاً
    if(order.status==='accepted'){
      showToast('الطلب مقبول مسبقاً');
      return;
    }
    if(order.status==='delivered'){
      showToast('الطلب تم توصيله مسبقاً');
      return;
    }

    const btn = document.getElementById(`btn-accept-${firebaseId}`);
    if(btn) { btn.disabled=true; btn.textContent='جاري القبول...'; }

    // 1. تغيير الحالة في Firebase باستخدام المفتاح الحقيقي
    const orderRef = ref(db, `users/${u.uid}/orders/${firebaseId}`);
    console.log('[ORDERS] Accepting order:', firebaseId);
    await update(orderRef, {
      status: 'accepted',
      acceptedAt: new Date().toISOString()
    });
    console.log('[ORDERS] Status updated to accepted');

    // 2. تحضير رقم الهاتف
    const normalized = normalizePhone(order.phone);
    if(!normalized){
      showToast('تم قبول الطلب لكن رقم الهاتف غير صالح: '+(order.phone||''));
      return;
    }

    // 3. بناء رسالة WhatsApp
    const itemsDetails = (order.items||[]).map(i=>{
      const total = (parseFloat(i.price||0)*parseInt(i.qty||0)).toFixed(2);
      return `- ${i.name} × ${i.qty} = ${total} درهم`;
    }).join('\n');

    const payText = formatPay(order.paymentMethod);
    const message = `السلام عليكم ${order.clientName||'عزي الزبون'} 👋

شكراً جزيلاً لطلبك وثقتك بنا ❤️

نؤكد لك أن طلبك تم قبوله بنجاح ✅

📦 تفاصيل الطلب:
${itemsDetails}

💰 الإجمالي: ${(parseFloat(order.totalValue||0)).toFixed(2)} درهم
💳 طريقة الدفع: ${payText}

📍 المدينة: ${order.city||'-'}
📍 العنوان: ${order.address||'-'}

طلبك الآن قيد التجهيز، وسيتم توصيله إليك إن شاء الله في أقرب وقت ممكن 🚚📦

شكراً لاختيارك لنا، ونتمنى أن تنال خدمتنا رضاك 🙏

Karni Pro`;

    // 4. فتح WhatsApp
    const waUrl = `https://wa.me/${normalized}?text=${encodeURIComponent(message)}`;
    console.log('[ORDERS] Opening WhatsApp:', waUrl);
    window.open(waUrl, '_blank');

  }catch(e){
    console.error('[ORDERS] acceptOrder error:', e);
    showToast('فشل قبول الطلب: '+(e.message||e));
    const btn = document.getElementById(`btn-accept-${firebaseId}`);
    if(btn){ btn.disabled=false; btn.textContent='قبول'; }
  }
}

window.closeOrder = async (firebaseId)=>{
  try{
    const u=auth.currentUser;
    if(!u) return;
    if(!firebaseId){ showToast('معرف الطلب غير موجود'); return; }
    const order = cachedOrders.find(o=>o.firebaseId===firebaseId);
    if(!order){ showToast('الطلب غير موجود'); return; }
    console.log('[ORDERS] Marking delivered:', firebaseId);
    await update(ref(db, `users/${u.uid}/orders/${firebaseId}`), {
      status:'delivered',
      deliveredAt: new Date().toISOString()
    });
    showToast('تم تحديث الطلب إلى تم التوصيل');
  }catch(e){
    console.error('[ORDERS] closeOrder error:', e);
    showToast('خطأ: '+(e.message||e));
  }
}
</script>
</body>
</html>
