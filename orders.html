<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>طلبات الزبائن - Karni Pro</title>
<script src="lang.js"></script>
<script>setTimeout(()=>{var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s);var l=document.createElement('link');l.rel='stylesheet';l.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css';document.head.appendChild(l);},80);</script>
<style>
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}
.modal.active{display:flex}
.animate-pop{animation:pop.28s cubic-bezier(.34,1.56,.64,1)} @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
.gallery-modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:110;display:none;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(8px)}
.gallery-modal.active{display:flex}
.gallery-card{animation:pop.3s cubic-bezier(.34,1.56,.64,1)}
.thumb-active{border-color:#059669!important;box-shadow:0 0 0 2px #059669}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{ -ms-overflow-style:none; scrollbar-width:none}
</style>
</head>
<body class="bg-gray-50">
<header class="bg-white border-b sticky top-0 z-20"><div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center"><a href="matjar.html" class="w-9 h-9 bg-gray-100 rounded-xl flex items-center justify-center"><i class="fa-solid fa-arrow-right"></i></a><h1 class="font-bold">طلبات الزبائن</h1><div class="w-9"></div></div></header>
<main class="max-w-4xl mx-auto px-4 pt-4 pb-6">
<div id="ordersList" class="space-y-3"></div>
<div id="empty" class="hidden text-center py-16"><i class="fa-solid fa-inbox text-4xl text-gray-300"></i><p class="text-gray-500 mt-2">لا توجد طلبات بعد</p></div>
</main>

<div id="deleteModal" class="modal" style="z-index:95">
  <div class="bg-white rounded-[24px] w-full max-w-sm p-6 text-center animate-pop">
    <div class="w-16 h-16 bg-red-50 rounded-full flex items-center justify-center mx-auto mb-4"><i class="fa-solid fa-trash text-2xl text-red-500"></i></div>
    <h3 class="font-bold text-[16px] mb-2">هل أنت متأكد من حذف هذا الطلب؟</h3>
    <p class="text-[13px] text-gray-500 mb-6">سيتم حذف الطلب نهائياً ولا يمكن التراجع</p>
    <div class="flex gap-3">
      <button onclick="closeDeleteModal()" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold text-sm">إلغاء</button>
      <button onclick="confirmDeleteOrder()" id="confirmDeleteBtn" class="flex-1 py-3 bg-red-600 hover:bg-red-700 text-white rounded-xl font-bold text-sm">حذف الطلب</button>
    </div>
  </div>
</div>

<div id="galleryModal" class="gallery-modal" onclick="if(event.target.id==='galleryModal') closeGallery()">
  <div class="gallery-card bg-white rounded-[20px] w-full max-w-lg overflow-hidden max-h-[90vh] flex flex-col">
    <div class="p-3 flex items-center justify-between border-b">
      <div class="flex items-center gap-2"><span id="galleryCounter" class="bg-gray-900 text-white text-[11px] px-2.5 py-1 rounded-full font-bold">1 / 1</span><span id="galleryProductName" class="font-bold text-sm truncate max-w-[180px]"></span></div>
      <button onclick="closeGallery()" class="w-9 h-9 bg-gray-100 rounded-full flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="relative bg-gray-50 flex-1 flex items-center justify-center overflow-hidden" id="galleryMainWrap" style="min-height:340px">
      <button onclick="prevGallery()" class="absolute right-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/90 shadow-lg rounded-full flex items-center justify-center z-10"><i class="fa-solid fa-chevron-right"></i></button>
      <button onclick="nextGallery()" class="absolute left-3 top-1/2 -translate-y-1/2 w-10 h-10 bg-white/90 shadow-lg rounded-full flex items-center justify-center z-10"><i class="fa-solid fa-chevron-left"></i></button>
      <img id="galleryMainImage" src="" class="max-w-full max-h-[55vh] object-contain" draggable="false">
    </div>
    <div class="p-3 bg-white border-t"><div id="galleryThumbs" class="flex gap-2 overflow-x-auto no-scrollbar pb-1"></div></div>
  </div>
</div>

<div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-[100]"><div class="bg-gray-900 text-white px-6 py-3 rounded-xl shadow-lg"><span id="toastMessage" class="text-sm"></span></div></div>

<script type="module">
import { auth, db } from "./firebase.js";
import { ref, onValue, update, get } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
function showToast(msg){ const t=document.getElementById('toast'); if(!t) return; document.getElementById('toastMessage').textContent=msg; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),3500); }
function normalizePhone(raw){
  if(!raw) return null;
  let p=String(raw).trim().replace(/[\s\-\(\)]/g,''); if(p.startsWith('+')) p=p.slice(1); p=p.replace(/\D/g,''); if(!p) return null;
  if(p.startsWith('212')&&p.length===12&&/^212[67]\d{8}$/.test(p)) return p;
  if(p.startsWith('0')&&p.length===10&&/^0[67]\d{8}$/.test(p)) return '212'+p.slice(1);
  if(p.length===9&&/^[67]\d{8}$/.test(p)) return '212'+p; return null;
}
function formatPay(m){ return m==='cod'?'الدفع عند الاستلام':'الدفع الآن'; }
let productsMap={};
function extractImagesFromItem(item){
  let imgs=[]; if(!item) return [];
  if(Array.isArray(item.images)) imgs=imgs.concat(item.images);
  if(Array.isArray(item.imageUrls)) imgs=imgs.concat(item.imageUrls);
  if(item.mainImage) imgs.push(item.mainImage);
  if(item.image) imgs.push(item.image);
  if(item.imageUrl) imgs.push(item.imageUrl);
  imgs=imgs.map(u=>String(u||'').trim()).filter(u=>u.startsWith('http'));
  return [...new Set(imgs)];
}
function getImagesForItem(item){
  let imgs=extractImagesFromItem(item);
  if(item&&item.productId&&productsMap[item.productId]){
    const prod=productsMap[item.productId];
    let pImgs=[]; if(Array.isArray(prod.images)) pImgs=pImgs.concat(prod.images);
    if(prod.mainImage) pImgs.push(prod.mainImage); if(prod.image) pImgs.push(prod.image);
    pImgs=pImgs.map(u=>String(u||'').trim()).filter(u=>u.startsWith('http'));
    imgs=[...new Set([...imgs,...pImgs])];
  }
  if(imgs.length===0) return ['https://via.placeholder.com/300?text=No+Image'];
  return imgs;
}
let galleryImages=[], galleryIndex=0, touchStartX=0;
window.openGalleryForItem=(orderId,itemIdx)=>{
  const order=cachedOrders.find(o=>o.firebaseId===orderId); if(!order) return;
  const item=order.items[itemIdx]; if(!item) return;
  galleryImages=getImagesForItem(item); galleryIndex=0;
  document.getElementById('galleryProductName').textContent=item.name||'المنتج';
  renderGallery(); document.getElementById('galleryModal').classList.add('active'); document.body.style.overflow='hidden';
}
function renderGallery(){
  if(!galleryImages.length) return;
  document.getElementById('galleryMainImage').src=galleryImages[galleryIndex];
  document.getElementById('galleryCounter').textContent=`${galleryIndex+1} / ${galleryImages.length}`;
  document.getElementById('galleryThumbs').innerHTML=galleryImages.map((src,i)=>`<img src="${escapeHtml(src)}" onclick="goGallery(${i})" class="w-16 h-16 rounded-xl object-cover border-2 cursor-pointer flex-shrink-0 ${i===galleryIndex?'thumb-active border-emerald-600':'border-transparent'}">`).join('');
}
window.nextGallery=()=>{ if(!galleryImages.length) return; galleryIndex=(galleryIndex+1)%galleryImages.length; renderGallery(); }
window.prevGallery=()=>{ if(!galleryImages.length) return; galleryIndex=(galleryIndex-1+galleryImages.length)%galleryImages.length; renderGallery(); }
window.goGallery=(i)=>{ galleryIndex=i; renderGallery(); }
window.closeGallery=()=>{ document.getElementById('galleryModal').classList.remove('active'); document.body.style.overflow=''; }
document.getElementById('galleryMainWrap').addEventListener('touchstart', e=>{ touchStartX=e.touches[0].clientX; }, {passive:true});
document.getElementById('galleryMainWrap').addEventListener('touchend', e=>{
  const diff=e.changedTouches[0].clientX-touchStartX; if(Math.abs(diff)>50){ if(diff>0) prevGallery(); else nextGallery(); }
}, {passive:true});

let cachedOrders=[], pendingDeleteId=null;
onAuthStateChanged(auth, async (user)=>{
  if(!user){ location.href='login.html'; return; }
  try{
    const snapProd=await get(ref(db, `users/${user.uid}/products`));
    if(snapProd.exists()){
      const val=snapProd.val(); if(val._init) delete val._init;
      Object.values(val).forEach(p=>{ if(p&&p.id) productsMap[p.id]=p; });
    }
  }catch(e){}
  const ordersRef=ref(db, `users/${user.uid}/orders`);
  onValue(ordersRef, (snap)=>{
    const list=document.getElementById('ordersList'); const empty=document.getElementById('empty');
    if(!snap.exists()){ cachedOrders=[]; list.innerHTML=''; empty.classList.remove('hidden'); return; }
    empty.classList.add('hidden');
    cachedOrders=Object.entries(snap.val()).map(([fid,data])=>({firebaseId:String(fid),...data})).sort((a,b)=>new Date(b.createdAt||0)-new Date(a.createdAt||0));
    list.innerHTML=cachedOrders.map(o=>{
      const statusClass=o.status==='new'?'bg-red-100 text-red-600':o.status==='pending'?'bg-amber-100 text-amber-700':o.status==='accepted'?'bg-blue-100 text-blue-700':'bg-emerald-100 text-emerald-700';
      const isEdited = o.updatedAt && o.updatedAt!==o.createdAt;
      const itemsHtml=(o.items||[]).map((it,idx)=>{
        const imgs=getImagesForItem(it); const first=imgs[0];
        return `<div class="flex items-center justify-between gap-2 bg-white border rounded-xl p-2">
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <div class="relative"><img src="${escapeHtml(first)}" class="w-14 h-14 rounded-xl object-cover border cursor-pointer" onclick="openGalleryForItem('${escapeHtml(o.firebaseId)}',${idx})"><span class="absolute -top-1 -right-1 bg-gray-900 text-white text-[10px] px-1.5 rounded-full">${imgs.length>1?imgs.length:''}</span></div>
            <div class="min-w-0"><div class="font-bold text-[13px] truncate">${escapeHtml(it.name)}</div><div class="text-[11px] text-gray-500">× ${it.qty}</div></div>
          </div>
          <span class="font-bold text-[13px]">${(parseFloat(it.price||0)*parseInt(it.qty||0)).toFixed(2)} د</span>
        </div>`;
      }).join('');
      return `<div class="bg-white rounded-2xl border p-4">
        <div class="flex justify-between items-start gap-3 mb-2">
          <div class="flex items-center gap-2 flex-wrap">
            <button data-id="${escapeHtml(o.firebaseId)}" onclick="openDeleteModal(this.dataset.id)" class="w-8 h-8 bg-red-50 text-red-500 rounded-full flex items-center justify-center"><i class="fa-solid fa-trash text-[12px]"></i></button>
            <span class="text-xs ${statusClass} px-2.5 py-1 rounded-full font-bold">${escapeHtml(o.status||'new')}</span>
            ${isEdited?`<span class="text-[10px] bg-blue-50 text-blue-700 border border-blue-100 px-2 py-1 rounded-full font-bold"><i class="fa-solid fa-pen ml-1"></i>تم تعديله${o.editCount?` (${o.editCount})`:''}</span>`:''}
            ${o.source==='public_store'?`<span class="text-[10px] bg-gray-100 text-gray-600 px-2 py-1 rounded-full">متجر عام</span>`:''}
          </div>
          <div class="font-bold text-[13px] truncate text-left">${escapeHtml(o.clientName||'زبون')} - ${escapeHtml(o.phone||'')}</div>
        </div>
        <p class="text-xs text-gray-500 mb-2">${o.createdAt?new Date(o.createdAt).toLocaleString('ar-MA'):''} - ${escapeHtml(o.city||'')} - ${formatPay(o.paymentMethod)}</p>
        ${isEdited?`<div class="mb-2 text-[11px] bg-blue-50 border border-blue-100 rounded-xl p-2 flex items-center justify-between"><span class="text-blue-700 font-bold">✏️ تم تعديل الطلب</span><span class="text-gray-500">${new Date(o.updatedAt).toLocaleString('ar-MA')}</span></div>`:''}
        <div class="bg-gray-50 rounded-xl p-2 space-y-2">${itemsHtml}</div>
        <div class="mt-2 text-[11px] text-gray-500 space-y-1">
          ${o.address?`<div>📍 ${escapeHtml(o.address)}</div>`:''}
          ${o.note?`<div>📝 ${escapeHtml(o.note)}</div>`:''}
        </div>
        <div class="flex justify-between font-bold mt-2 pt-2 border-t"><span>الإجمالي</span><span class="text-emerald-600">${(parseFloat(o.totalValue||0)).toFixed(2)} درهم</span></div>
        <div class="flex gap-2 mt-3">
          ${o.status==='accepted'?`<button disabled class="flex-1 bg-blue-100 text-blue-700 py-2 rounded-xl text-sm font-bold">✓ تم قبول الطلب</button>`:o.status==='delivered'?`<button disabled class="flex-1 bg-emerald-100 text-emerald-700 py-2 rounded-xl text-sm font-bold">✓ تم التوصيل</button>`:`<button data-id="${escapeHtml(o.firebaseId)}" onclick="acceptOrder(this.dataset.id)" id="btn-accept-${escapeHtml(o.firebaseId)}" class="flex-1 bg-emerald-600 text-white py-2 rounded-xl text-sm font-bold">قبول</button>`}
          <button data-id="${escapeHtml(o.firebaseId)}" onclick="closeOrder(this.dataset.id)" class="flex-1 bg-gray-100 py-2 rounded-xl text-sm">تم التوصيل</button>
        </div>
      </div>`;
    }).join('');
  });
});
window.openDeleteModal=(id)=>{ pendingDeleteId=String(id||'').trim(); if(!pendingDeleteId) return; document.getElementById('deleteModal').classList.add('active'); }
window.closeDeleteModal=()=>{ pendingDeleteId=null; document.getElementById('deleteModal').classList.remove('active'); const b=document.getElementById('confirmDeleteBtn'); if(b){ b.disabled=false; b.textContent='حذف الطلب'; } }
window.confirmDeleteOrder=async()=>{
  if(!pendingDeleteId) return; try{ const u=auth.currentUser; if(!u) return; const btn=document.getElementById('confirmDeleteBtn'); if(btn){ btn.disabled=true; btn.textContent='جاري الحذف...'; } await update(ref(db, `users/${u.uid}/orders`), {[pendingDeleteId]:null}); closeDeleteModal(); showToast('تم حذف الطلب بنجاح'); }catch(e){ showToast('فشل حذف الطلب: '+(e.message||e)); const b=document.getElementById('confirmDeleteBtn'); if(b){ b.disabled=false; b.textContent='حذف الطلب'; } }
}
window.acceptOrder=async(id)=>{
  try{
    const u=auth.currentUser; if(!u) return; const order=cachedOrders.find(o=>o.firebaseId===id); if(!order) return;
    const normalized=normalizePhone(order.phone); if(!normalized){ showToast('رقم الهاتف غير صالح'); return; }
    const itemsDetails=(order.items||[]).map(i=>`- ${i.name} × ${i.qty} = ${(parseFloat(i.price||0)*parseInt(i.qty||0)).toFixed(2)} درهم`).join('\n');
    const message=`السلام عليكم ${order.clientName||'عزيزي الزبون'} 👋\n\nشكراً لطلبك ❤️\nتم قبول طلبك ✅\n\n📦 ${itemsDetails}\n\n💰 الإجمالي: ${(parseFloat(order.totalValue||0)).toFixed(2)} درهم\n📍 ${order.city||''}\n${order.address?`📍 ${order.address}`:''}\n\nسيتم التوصيل قريباً 🚚\nKarni Pro`;
    await update(ref(db, `users/${u.uid}/orders/${id}`), {status:'accepted', acceptedAt:new Date().toISOString()});
    window.open(`https://wa.me/${normalized}?text=${encodeURIComponent(message)}`,'_blank');
  }catch(e){ showToast('فشل: '+(e.message||e)); }
}
window.closeOrder=async(id)=>{ try{ const u=auth.currentUser; if(!u) return; await update(ref(db, `users/${u.uid}/orders/${id}`), {status:'delivered', deliveredAt:new Date().toISOString()}); showToast('تم التوصيل'); }catch(e){ showToast('خطأ: '+e.message); } }
document.getElementById('deleteModal').addEventListener('click', e=>{ if(e.target.id==='deleteModal') closeDeleteModal(); });
</script>
</body>
</html>
