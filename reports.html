<div id="toast" class="hidden fixed top-20 left-1/2 z-[100]" style="transform:translateX(-50%)"><div class="bg-gray-900 text-white px-6 py-3 rounded-xl"><span id="toastMessage" class="text-sm"></span></div></div>
<script type="module">
import { auth, db } from "./firebase.js";
import { ref, get, set, remove } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

let allOrders = [];
let allProducts = [];
let groupedByClient = {};
let aggregatedTotal = {};
let currentViewingClient = null;
let currentBonItems = [];
let currentUid = null;

function getOrdersCacheKey(){ return `reports_orders_${currentUid}`; }
function getProdCacheKey(){ return `products_${currentUid}`; }

function saveCache(){
  try{
    if(!currentUid) return;
    localStorage.setItem(getOrdersCacheKey(), JSON.stringify({t:Date.now(), orders:allOrders, grouped:groupedByClient, agg:aggregatedTotal}));
  }catch(e){}
}
function loadCache(){
  try{
    if(!currentUid) return null;
    var raw=localStorage.getItem(getOrdersCacheKey());
    if(!raw) return null;
    var p=JSON.parse(raw);
    if(Date.now()-p.t>10*60*1000) return null;
    return p;
  }catch(e){ return null; }
}
function renderInstant(){
  var c=loadCache();
  if(c&&c.orders){
    allOrders=c.orders;
    groupedByClient=c.grouped;
    aggregatedTotal=c.agg;
    try{
      var pr=localStorage.getItem(getProdCacheKey());
      if(pr){
        var parsed = JSON.parse(pr);
        allProducts = parsed.d || parsed || [];
      }
    }catch(e){}
    renderPersons();
    renderTotal();
    updateStats();
    return true;
  }
  return false;
}

window.loadFirebase = async function(){
  if(!currentUid) return;
  try{
    var snapProd=await get(ref(db, `users/${currentUid}/products`));
    if(snapProd.exists()){
      var val = snapProd.val();
      if(val._init) delete val._init;
      allProducts=Object.values(val).filter(v=>v && typeof v==='object' &&!v._init);
      try{ localStorage.setItem(getProdCacheKey(), JSON.stringify({v:'v3', t:Date.now(), d:allProducts})); }catch(e){}
    }
  }catch(e){}
  allOrders=[];
  try{
    var snap=await get(ref(db, `users/${currentUid}/orders`));
    if(snap.exists()){
      var val=snap.val();
      if(val._init) delete val._init;
      Object.keys(val).forEach(function(k){
        if(k==='_init') return;
        var o=val[k];
        if(!o) return;
        o.id=k;
        allOrders.push(o);
      });
    }
  }catch(e){}
  try{
    var snapB=await get(ref(db, `users/${currentUid}/clientBons`));
    if(snapB.exists()){
      var vb=snapB.val();
      if(vb._init) delete vb._init;
      Object.keys(vb).forEach(function(clientName){
        if(clientName==='_init') return;
        var bon=vb[clientName];
        if(!bon) return;
        if(bon&&bon.items) allOrders.push({id:'bon_'+clientName, clientName:clientName, items:bon.items, isEditedBon:true});
        else if(Array.isArray(bon)) allOrders.push({id:'bon_'+clientName, clientName:clientName, items:bon, isEditedBon:true});
      });
    }
  }catch(e){}
  processData();
  saveCache();
}

function processData(){
  groupedByClient={}; aggregatedTotal={};
  allOrders.forEach(function(order){
    var client=order.clientName||'بدون اسم';
    if(!groupedByClient[client]) groupedByClient[client]=[];
    groupedByClient[client].push(order);
    (order.items||[]).forEach(function(item){
      var key=item.name||item.productId;
      if(!aggregatedTotal[key]){ aggregatedTotal[key]={name:item.name, qty:0, total:0, price:item.price||0}; }
      aggregatedTotal[key].qty+=parseInt(item.qty)||0;
      aggregatedTotal[key].total+=(parseFloat(item.price)||0)*(parseInt(item.qty)||0);
    });
  });
  renderPersons(); renderTotal(); updateStats();
}
function updateStats(){
  var persons=Object.keys(groupedByClient).length; var totalQty=0,totalVal=0;
  Object.values(aggregatedTotal).forEach(function(t){ totalQty+=t.qty; totalVal+=t.total; });
  document.getElementById('personsCount').textContent=persons;
  document.getElementById('totalQty').textContent=totalQty;
  document.getElementById('totalValue').textContent=totalVal.toFixed(2)+' درهم';
}
function renderPersons(){
  var container=document.getElementById('personsContainer');
  var clients=Object.keys(groupedByClient);
  if(clients.length===0){ container.innerHTML='<div class="text-center py-12 bg-white rounded-2xl border"><p class="text-gray-500 text-sm">لا توجد بونات</p></div>'; return; }
  var html='';
  clients.forEach(function(client){
    var orders=groupedByClient[client]; var totalQty=0,totalVal=0;
    orders.forEach(function(o){ (o.items||[]).forEach(function(i){ totalQty+=parseInt(i.qty)||0; totalVal+=(parseFloat(i.price)||0)*(parseInt(i.qty)||0); }); });
    html+='<div class="card bg-white rounded-2xl border p-4 cursor-pointer" onclick="openBon(\''+client.replace(/\'/g,"\\'")+'\')"><div class="flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center"><span class="font-bold">'+client.charAt(0)+'</span></div><div><h3 class="font-bold">'+client+'</h3><p class="text-xs text-gray-500">'+orders.length+' بون • '+totalQty+' منتج</p></div></div><div><p class="font-bold text-emerald-600">'+totalVal.toFixed(2)+' درهم</p></div></div></div>';
  });
  container.innerHTML=html;
}
function renderTotal(){
  var container=document.getElementById('totalSummary');
  var totals=Object.values(aggregatedTotal).sort(function(a,b){ return b.qty-a.qty; });
  if(totals.length===0){ container.innerHTML='<p class="text-sm text-gray-400 text-center py-4">لا يوجد مجموع</p>'; return; }
  var h='';
  totals.forEach(function(t){
    h+='<div class="flex items-center justify-between bg-gray-50 rounded-xl p-3"><div><p class="font-bold text-sm">'+t.name+'</p><p class="text-xs text-gray-500">'+t.qty+' وحدة • '+t.total.toFixed(2)+' درهم</p></div><span class="bg-emerald-600 text-white text-sm font-bold px-3 py-1 rounded-full">'+t.qty+'</span></div>';
  });
  container.innerHTML=h;
}
window.openBon = function(clientName){
  currentViewingClient=clientName;
  var orders=groupedByClient[clientName]||[];
  var merged={};
  orders.forEach(function(o){
    (o.items||[]).forEach(function(item){
      var key=item.productId||item.name;
      if(!merged[key]) merged[key]={productId:item.productId, name:item.name, qty:0, price:item.price};
      merged[key].qty+=parseInt(item.qty)||0;
      merged[key].price=item.price;
    });
  });
  currentBonItems=Object.values(merged);
  document.getElementById('bonClientName').textContent='بون '+clientName;
  document.getElementById('bonDate').textContent=new Date().toLocaleDateString('ar-MA');
  renderBonItems();
  document.getElementById('bonModal').classList.add('active');
}
function renderBonItems(){
  var container=document.getElementById('bonItems');
  if(currentBonItems.length===0){ container.innerHTML='<p class="text-center text-gray-400 py-8">البون فارغ</p>'; document.getElementById('bonTotal').textContent='0 درهم'; return; }
  var html='';
  currentBonItems.forEach(function(item, idx){
    html+='<div class="bg-gray-50 rounded-xl p-3 flex gap-3"><div class="flex-1"><p class="font-bold text-sm">'+item.name+'</p><div class="flex items-center gap-2 mt-2"><button onclick="updateQty('+idx+',-1)" class="w-7 h-7 bg-white border rounded-full">-</button><input type="number" value="'+item.qty+'" onchange="updateQtyInput('+idx+',this.value)" class="w-12 h-7 text-center border rounded-lg text-sm font-bold"><button onclick="updateQty('+idx+',1)" class="w-7 h-7 bg-white border rounded-full">+</button><input type="number" value="'+(item.price||0)+'" onchange="updatePrice('+idx+',this.value)" class="w-20 h-7 border rounded-lg text-sm px-2"></div></div><button onclick="removeItem('+idx+')" class="w-8 h-8 bg-red-50 text-red-500 rounded-full">×</button></div>';
  });
  container.innerHTML=html;
  var total=0;
  currentBonItems.forEach(function(i){ total+=(parseFloat(i.price)||0)*(parseInt(i.qty)||0); });
  document.getElementById('bonTotal').textContent=total.toFixed(2)+' درهم';
}
window.updateQty = function(idx,d){ currentBonItems[idx].qty=Math.max(0,(parseInt(currentBonItems[idx].qty)||0)+d); if(currentBonItems[idx].qty===0) currentBonItems.splice(idx,1); renderBonItems(); }
window.updateQtyInput = function(idx,v){ currentBonItems[idx].qty=Math.max(0,parseInt(v)||0); renderBonItems(); }
window.updatePrice = function(idx,v){ currentBonItems[idx].price=parseFloat(v)||0; renderBonItems(); }
window.removeItem = function(idx){ currentBonItems.splice(idx,1); renderBonItems(); }
window.saveBonEdits = async function(){
  if(!currentViewingClient ||!currentUid) return;
  try{ await set(ref(db, `users/${currentUid}/clientBons/${currentViewingClient}`), {items: currentBonItems, updatedAt: new Date().toISOString()}); showToast('تم الحفظ'); await loadFirebase(); renderBonItems(); }catch(e){ showToast('خطأ: '+e.message); }
}

// === نظام حذف البون الجديد - بدون confirm() ===
window.deleteClientBon = function(){
  if(!currentViewingClient ||!currentUid) return;
  openDeleteBonModal();
}
window.openDeleteBonModal = function(){
  document.getElementById('deleteBonModal').classList.add('active');
}
window.closeDeleteBonModal = function(){
  document.getElementById('deleteBonModal').classList.remove('active');
}
window.confirmDeleteBon = async function(){
  if(!currentViewingClient ||!currentUid) return;
  closeDeleteBonModal();
  try{
    await remove(ref(db, `users/${currentUid}/clientBons/${currentViewingClient}`));
    for(var i=0;i<(groupedByClient[currentViewingClient]||[]).length;i++){
      var order=groupedByClient[currentViewingClient][i];
      if(order.id&&order.id.indexOf('bon_')!==0) await remove(ref(db, `users/${currentUid}/orders/${order.id}`)).catch(function(){});
    }
    localStorage.removeItem(getOrdersCacheKey());
    closeBon();
    await loadFirebase();
    showToast('تم حذف البون');
  }catch(e){ showToast('خطأ: '+e.message); }
}
// إغلاق بالضغط على الخلفية
document.getElementById('deleteBonModal')?.addEventListener('click', function(e){
  if(e.target===this) closeDeleteBonModal();
});

window.openAddProductToBon = function(){ document.getElementById('addProductModal').classList.add('active'); renderProductsToAdd(''); }
window.closeAddProductModal = function(){ document.getElementById('addProductModal').classList.remove('active'); }
function renderProductsToAdd(filter){
  var container=document.getElementById('productsToAdd');
  var list=allProducts;
  if(filter) list=list.filter(function(p){ return (p.name||'').toLowerCase().indexOf(filter.toLowerCase())>-1; });
  var h='';
  list.slice(0,30).forEach(function(p){
    h+='<div class="flex items-center justify-between p-2 hover:bg-gray-50 rounded-xl cursor-pointer" onclick="addToBon(\''+p.id+'\')"><div><p class="font-bold text-sm">'+p.name+'</p><p class="text-xs text-gray-500">'+(parseFloat(p.price||0).toFixed(2))+' درهم</p></div><button class="w-8 h-8 bg-emerald-600 text-white rounded-full">+</button></div>';
  });
  container.innerHTML=h;
}
window.addToBon = function(id){
  var p=null;
  for(var i=0;i<allProducts.length;i++){ if(allProducts[i].id==id){ p=allProducts[i]; break; } }
  if(!p) return;
  var ex=null;
  for(var j=0;j<currentBonItems.length;j++){ if(currentBonItems[j].productId==p.id) ex=currentBonItems[j]; }
  if(ex) ex.qty++;
  else currentBonItems.push({productId:p.id, name:p.name, qty:1, price:p.price||0});
  renderBonItems();
  closeAddProductModal();
}
window.closeBon = function(){ document.getElementById('bonModal').classList.remove('active'); currentViewingClient=null; }

function buildPrintHTML(width){
  var now = new Date();
  var dateStr = now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  var timeStr = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  var invNum = '000000';
  try{
    var hash = 0;
    var str = currentViewingClient + dateStr + now.getTime();
    for(var i=0;i<str.length;i++){ hash = ((hash<<5)-hash)+str.charCodeAt(i); hash|=0; }
    invNum = String(Math.abs(hash)%1000000).padStart(6,'0');
  }catch(e){}

  var total=0;
  currentBonItems.forEach(function(i){ total+=(parseFloat(i.price)||0)*(parseInt(i.qty)||0); });

  var rows='';
  currentBonItems.forEach(function(i){
    var lineTotal=(parseFloat(i.price)||0)*parseInt(i.qty||0);
    rows+='<div style="display:flex;flex-direction:row;justify-content:flex-start;align-items:center;padding:5px 0;width:100%;box-sizing:border-box;direction:rtl;">';
    rows+='<div style="width:45%;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;direction:rtl;padding-left:2px;box-sizing:border-box;">'+escapeHtml(i.name)+'</div>';
    rows+='<div style="width:15%;text-align:center;box-sizing:border-box;">'+i.qty+'</div>';
    rows+='<div style="width:20%;text-align:center;box-sizing:border-box;">'+parseFloat(i.price||0).toFixed(2)+'</div>';
    rows+='<div style="width:20%;text-align:center;box-sizing:border-box;">'+lineTotal.toFixed(2)+'</div>';
    rows+='</div>';
    rows+='<div style="border-top:1px dashed #000;width:100%;margin:0;padding:0;"></div>';
  });

  var html='';
  html+='<div style="width:100%;max-width:'+width+'mm;margin:0 auto;background:#fff;color:#000;font-family:monospace, Courier New, sans-serif;font-size:11px;line-height:1.5;padding:3mm 2mm;box-sizing:border-box;direction:ltr;">';
  html+='<div style="text-align:center;font-weight:900;font-size:18px;letter-spacing:1px;">KARNI PRO</div>';
  html+='<div style="border-top:1px dashed #000;margin:6px 0;width:100%;"></div>';
  html+='<div style="display:flex;flex-direction:column;gap:2px;width:100%;direction:rtl;">';
  html+='<div style="display:flex;flex-direction:row;justify-content:space-between;width:100%;"><span>التاريخ : '+dateStr+'</span><span></span></div>';
  html+='<div style="display:flex;flex-direction:row;justify-content:space-between;width:100%;"><span>الوقت : '+timeStr+'</span><span></span></div>';
  html+='<div style="display:flex;flex-direction:row;justify-content:space-between;width:100%;"><span>العميل : '+escapeHtml(currentViewingClient)+'</span><span></span></div>';
  html+='<div style="display:flex;flex-direction:row;justify-content:space-between;width:100%;"><span>رقم الفاتورة : '+invNum+'</span><span></span></div>';
  html+='</div>';
  html+='<div style="border-top:1px solid #000;margin:8px 0;width:100%;"></div>';
  html+='<div style="display:flex;flex-direction:row;justify-content:flex-start;align-items:center;font-weight:800;border-bottom:1px solid #000;padding:4px 0;width:100%;box-sizing:border-box;direction:rtl;">';
  html+='<div style="width:45%;text-align:right;">المنتج</div>';
  html+='<div style="width:15%;text-align:center;">الكمية</div>';
  html+='<div style="width:20%;text-align:center;">الثمن</div>';
  html+='<div style="width:20%;text-align:center;">المجموع</div>';
  html+='</div>';
  html+='<div style="border-top:1px solid #000;width:100%;"></div>';
  html+=rows;
  html+='<div style="border-top:1px solid #000;margin:0;width:100%;"></div>';
  html+='<div style="display:flex;flex-direction:row;justify-content:space-between;font-weight:900;font-size:13px;padding:8px 0;width:100%;direction:rtl;box-sizing:border-box;">';
  html+='<span>المجموع العام : '+total.toFixed(2)+' درهم</span>';
  html+='</div>';
  html+='<div style="border-top:1px solid #000;margin:8px 0;width:100%;"></div>';
  html+='<div style="text-align:center;font-size:11px;font-weight:700;padding:4px 0;width:100%;direction:rtl;">شكراً لتعاونكم معنا</div>';
  html+='</div>';
  return html;
}

function escapeHtml(str){
  if(!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

window.doPrint = function(width){
  if(!currentViewingClient || currentBonItems.length===0) return;
  var area=document.getElementById('thermalPrintArea');
  area.innerHTML=buildPrintHTML(width);
  area.style.display='block';
  area.style.width=width+'mm';
  setTimeout(function(){ window.print(); setTimeout(function(){ area.style.display='none'; },600); },300);
}

window.doPrintPDF = function(){
  if(!currentViewingClient || currentBonItems.length===0) return;
  var area=document.getElementById('thermalPrintArea');
  area.innerHTML=buildPrintHTML(80);
  area.style.display='block';
  area.style.width='210mm';
  setTimeout(function(){ window.print(); setTimeout(function(){ area.style.display='none'; },600); },300);
}
