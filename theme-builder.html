<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>تخصيص المتجر</title>
<style>:root{--theme-primary:#10B981;--theme-secondary:#111827;--theme-accent:#059669;--theme-background:#F8FAFC;--theme-card:#fff;--theme-text:#111827;--theme-muted:#6B7280;--theme-radius:16px}*{font-family:'Cairo',sans-serif;box-sizing:border-box}body{background:var(--theme-background);margin:0}</style>
<script>setTimeout(()=>{var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s);var l=document.createElement('link');l.rel='stylesheet';l.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css';document.head.appendChild(l);},80);</script></head>
<body class="pb-32">
<header class="bg-white border-b sticky top-0 z-30"><div class="max-w-5xl mx-auto px-4 py-3 flex items-center gap-3"><a href="reglematjar.html" class="w-10 h-10 bg-gray-100 rounded-xl flex items-center justify-center"><i class="fa-solid fa-arrow-right"></i></a><div class="flex-1"><h1 class="font-bold">🎨 تخصيص مظهر المتجر</h1><p class="text-[11px] text-gray-500">غيّر تصميم متجرك واختر الـTheme المناسب</p></div></div></header>
<main class="max-w-5xl mx-auto px-4 pt-5 grid lg:grid-cols-[380px_1fr] gap-6">
<div class="space-y-4">
<div class="bg-white rounded-[20px] border p-4"><h2 class="font-bold text-[13px] mb-3">Themes</h2><div id="themeList" class="grid grid-cols-2 gap-2"></div></div>
<div class="bg-white rounded-[20px] border p-4"><h2 class="font-bold text-[13px] mb-3">الألوان</h2>
<div class="space-y-2"><div class="flex justify-between items-center"><span class="text-[11px]">Primary</span><input type="color" id="primaryColor"></div><div class="flex justify-between items-center"><span class="text-[11px]">Secondary</span><input type="color" id="secondaryColor"></div><div class="flex justify-between items-center"><span class="text-[11px]">Accent</span><input type="color" id="accentColor"></div></div>
</div>
<div class="bg-white rounded-[20px] border p-4"><h2 class="font-bold text-[13px] mb-3">شكل البطاقات والعرض</h2>
<div class="grid grid-cols-2 gap-2 text-[11px]"><button data-card="rounded" class="border rounded-xl py-2">Rounded</button><button data-card="large" class="border rounded-xl py-2">Large</button><button data-card="minimal" class="border rounded-xl py-2">Minimal</button><button data-card="luxury" class="border rounded-xl py-2">Luxury</button></div>
<div class="mt-3 grid grid-cols-2 gap-2 text-[11px]"><button data-layout="grid" class="border rounded-xl py-2">Grid</button><button data-layout="list" class="border rounded-xl py-2">List</button></div>
</div>
</div>
<div><h2 class="font-bold text-[13px] mb-3">👁️ Preview حقيقي</h2><div id="preview" class="bg-white rounded-[20px] border overflow-hidden sticky top-[70px]"></div></div>
</main>
<div class="fixed bottom-0 inset-x-0 bg-white border-t p-4 z-30"><div class="max-w-5xl mx-auto"><button id="saveBtn" class="w-full text-white py-3.5 rounded-xl font-bold" style="background:var(--theme-primary)">💾 حفظ ونشر</button></div></div>
<div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-xl text-sm z-50"></div>
<script type="module">
import { auth, db } from "./firebase.js"; import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js"; import { ThemeEngine, THEMES } from "./theme-engine.js";
ThemeEngine.setDB(db); let uid=null; let cur=ThemeEngine.getDefaultTheme();
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),2500); }
function renderThemeList(){ document.getElementById('themeList').innerHTML=Object.keys(THEMES).map(k=>`<div onclick="selectTheme('${k}')" id="th-${k}" class="border-2 rounded-xl p-3 cursor-pointer"><div class="h-10 rounded-lg mb-2" style="background:${THEMES[k].colors.primary}"></div><div class="font-bold text-[11px]">${THEMES[k].label}</div></div>`).join(''); }
function renderPreview(){ const t=cur; document.getElementById('preview').innerHTML=`<div class="p-3 flex justify-between items-center border-b" style="background:${t.colors.card}"><div class="w-8 h-8 rounded-xl flex items-center justify-center text-white font-bold" style="background:${t.colors.primary}">K</div><span style="color:${t.colors.text}" class="font-bold text-[12px]">متجري</span></div><div class="p-3 grid ${t.layout==='list'?'grid-cols-1':'grid-cols-2'} gap-3" style="background:${t.colors.background}">${[1,2,3,4].map(i=>`<div class="border p-2" style="background:${t.colors.card};border-radius:${t.layoutConfig?.borderRadius||'16px'}"><div class="h-20 rounded-lg mb-2" style="background:${t.colors.background}"></div><div class="text-[11px]" style="color:${t.colors.text}">منتج ${i}</div><div class="text-[11px] font-bold" style="color:${t.colors.primary}">49.00 د</div></div>`).join('')}</div>`; }
function applyLive(){ ThemeEngine.applyTheme(cur); renderPreview(); document.getElementById('primaryColor').value=cur.colors.primary; document.getElementById('secondaryColor').value=cur.colors.secondary; document.getElementById('accentColor').value=cur.colors.accent; document.querySelectorAll('[data-card]').forEach(b=>{ b.style.background = b.dataset.card===cur.cardStyle?cur.colors.primary:'#fff'; b.style.color=b.dataset.card===cur.cardStyle?'#fff':'#000'; }); document.querySelectorAll('[data-layout]').forEach(b=>{ b.style.background = b.dataset.layout===cur.layout?cur.colors.primary:'#fff'; b.style.color=b.dataset.layout===cur.layout?'#fff':'#000'; }); document.getElementById('saveBtn').style.background=cur.colors.primary; document.querySelectorAll('[id^="th-"]').forEach(el=>el.classList.remove('border-black')); document.getElementById('th-'+cur.theme)?.classList.add('border-black'); }
window.selectTheme=(name)=>{ cur = ThemeEngine.normalize({...cur, theme:name}); cur = {...cur,...THEMES[name], theme:name}; cur.colors={...cur.colors}; cur.layoutConfig={productColumns:2,borderRadius:THEMES[name].borderRadius}; applyLive(); };
document.getElementById('primaryColor').addEventListener('input', e=>{ cur.colors.primary=e.target.value; cur.primaryColor=e.target.value; applyLive(); });
document.getElementById('secondaryColor').addEventListener('input', e=>{ cur.colors.secondary=e.target.value; cur.secondaryColor=e.target.value; applyLive(); });
document.getElementById('accentColor').addEventListener('input', e=>{ cur.colors.accent=e.target.value; cur.accentColor=e.target.value; applyLive(); });
document.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click', ()=>{ cur.cardStyle=b.dataset.card; cur.productCard.style=b.dataset.card; applyLive(); }));
document.querySelectorAll('[data-layout]').forEach(b=>b.addEventListener('click', ()=>{ cur.layout=b.dataset.layout; applyLive(); }));
document.getElementById('saveBtn').addEventListener('click', async()=>{ const btn=document.getElementById('saveBtn'); btn.textContent='جاري الحفظ...'; try{ await ThemeEngine.saveTheme(uid, cur); toast('تم حفظ تصميم المتجر بنجاح ✅'); }catch(e){ console.error(e); toast('تعذر حفظ التصميم'); } btn.textContent='💾 حفظ ونشر'; });
onAuthStateChanged(auth, async u=>{ if(!u){ location.href='login.html'; return; } uid=u.uid; renderThemeList(); cur = await ThemeEngine.loadTheme(uid); applyLive(); });
</script></body></html>
