<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المتجر</title>
<script src="lang.js"></script>
<style>body{background:#f8fafc;margin:0;font-family:'Cairo',sans-serif}.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:80;display:none;align-items:center;justify-content:center;padding:16px}.modal.active{display:flex}.skeleton{background:linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);background-size:200% 100%;animation:loading 1.5s infinite}@keyframes loading{0%{background-position:200% 0}100%{background-position:-200% 0}}</style>
<script>setTimeout(()=>{var s=document.createElement('script');s.src='https://cdn.tailwindcss.com';document.head.appendChild(s);var l=document.createElement('link');l.rel='stylesheet';l.href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css';document.head.appendChild(l);},80);</script>
</head>
<body class="pb-28">
<header class="bg-white border-b sticky top-0 z-30">
  <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex gap-3 items-center"><div id="storeLogo" class="w-10 h-10 bg-emerald-600 rounded-xl text-white flex items-center justify-center font-bold">K</div><div><h1 id="storeName" class="font-bold text-sm">المتجر</h1><p class="text-[11px] text-gray-500">مرحبا بكم</p></div></div>
    <button id="cartBtn" class="w-10 h-10 bg-emerald-50 text-emerald-600 rounded-xl relative"><i class="fa-solid fa-bag-shopping"></i><span id="cartCount" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold">0</span></button>
  </div>
</header>
<main class="max-w-7xl mx-auto px-4 pt-4">
  <div id="errorBox" class="hidden bg-white border rounded-2xl p-8 text-center"><h2 class="font-bold mb-2" id="errorTitle"></h2><p class="text-sm text-gray-500" id="errorMsg"></p></div>
  <div class="bg-white rounded-2xl border p-3 mb-4"><input id="searchInput" placeholder="البحث عن منتج..." class="w-full px-4 py-3 rounded-xl border outline-none text-sm"></div>
  <div id="productsContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3"></div>
</main>
<div id="cartBar" class="hidden fixed bottom-0 inset-x-0 bg-white border-t shadow-2xl z-30"><div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center"><div><p class="text-xs text-gray-500"><span id="cartItemsCount">0</span> منتجات</p><p class="font-bold text-emerald-600"><span id="cartTotal">0</span> درهم</p></div><button onclick="openCheckout()" class="bg-emerald-600 text-white px-6 py-3 rounded-xl font-bold text-sm">إتمام الطلب</button></div></div>
<div id="qtyModal" class="modal"><div class="bg-white rounded-2xl w-full max-w-md overflow-hidden"><div class="p-4 border-b flex justify-between"><h3 class="font-bold">تحديد الكمية</h3><button onclick="closeQtyModal()" class="w-8 h-8 bg-gray-100 rounded-full">×</button></div><div class="p-4"><img id="qtyImg" class="w-full h-56 object-contain bg-gray-50 rounded-xl mb-3"><h3 id="qtyName" class="font-bold mb-1"></h3><p class="text-emerald-600 font-bold mb-3"><span id="qtyPrice">0</span> درهم - المخزون: <span id="qtyStock"></span></p><div class="flex gap-3 justify-center"><button onclick="changeModalQty(-1)" class="w-12 h-12 border-2 rounded-xl text-xl">-</button><input id="qtyInput" type="number" min="1" value="1" class="w-20 h-12 text-center border-2 border-emerald-200 rounded-xl font-bold"><button onclick="changeModalQty(1)" class="w-12 h-12 border-2 rounded-xl text-xl">+</button></div></div><div class="p-4 border-t flex gap-2"><button onclick="closeQtyModal()" class="px-6 py-3 bg-gray-100 rounded-xl">إلغاء</button><button onclick="confirmAddToCart()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">إضافة</button></div></div></div>
<div id="checkoutModal" class="modal"><div class="bg-white rounded-2xl w-full max-w-lg max-h-[92vh] overflow-y-auto"><div class="p-4 border-b flex justify-between"><h3 class="font-bold">معلوماتك</h3><button onclick="closeCheckout()" class="w-8 h-8 bg-gray-100 rounded-full">×</button></div><div class="p-4 space-y-3"><input id="cName" placeholder="الاسم الكامل *" class="w-full px-4 py-3 rounded-xl border"><input id="cPhone" placeholder="الهاتف *" class="w-full px-4 py-3 rounded-xl border"><input id="cCity" placeholder="المدينة *" class="w-full px-4 py-3 rounded-xl border"><input id="cAddress" placeholder="العنوان *" class="w-full px-4 py-3 rounded-xl border"><textarea id="cNote" placeholder="ملاحظة" class="w-full px-4 py-3 rounded-xl border"></textarea><div class="border rounded-xl p-3"><p class="font-bold text-sm mb-2">طريقة الطلب</p><label class="flex gap-2 p-2 border rounded-xl mb-2"><input type="radio" name="payMethod" value="cod" checked> الدفع عند الاستلام</label><label class="flex gap-2 p-2 border rounded-xl"><input type="radio" name="payMethod" value="online"> الدفع الآن</label></div><div id="cartSummary" class="bg-gray-50 rounded-xl p-3 space-y-2 text-sm"></div><div class="flex justify-between font-bold"><span>الإجمالي:</span><span id="finalTotal" class="text-emerald-600">0</span></div></div><div class="p-4 border-t flex gap-2"><button onclick="closeCheckout()" class="px-6 py-3 bg-gray-100 rounded-xl">رجوع</button><button onclick="confirmOrder()" class="flex-1 bg-emerald-600 text-white py-3 rounded-xl font-bold">تأكيد الطلب</button></div></div></div>
<div id="successModal" class="modal" style="z-index:90"><div class="bg-white rounded-2xl w-full max-w-md p-8 text-center"><div class="w-20 h-20 bg-emerald-100 rounded-full mx-auto mb-4 flex items-center justify-center"><i class="fa-solid fa-check text-3xl text-emerald-600"></i></div><h2 class="font-bold text-xl mb-2">تم إرسال طلبك بنجاح ✅</h2><p class="text-sm text-gray-500">رقم الطلب: <span id="successId" class="font-bold"></span></p><p class="text-sm mb-4">الإجمالي: <span id="successTotal" class="font-bold"></span> - <span id="successPay"></span></p><button onclick="location.reload()" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-bold">العودة للمتجر</button></div></div>
<div id="toast" class="hidden fixed top-20 left-1/2 -translate-x-1/2 z-[100]"><div class="bg-gray-900 text-white px-6 py-3 rounded-xl"><span id="toastMessage" class="text-sm"></span></div></div>
<script type="module">
import { db } from "./firebase.js";
import { ref, get, push } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-database.js";
let STORE_ID=null, products=[], cart=[], currentProduct=null;
function escapeHtml(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showError(title,msg){document.getElementById('errorBox').classList.remove('hidden');document.getElementById('errorTitle').textContent=title;document.getElementById('errorMsg').textContent=msg;document.getElementById('productsContainer').innerHTML='';}
async function init(){
  const params=new URLSearchParams(window.location.search);
  STORE_ID=params.get('store');
  if(!STORE_ID){ showError('رابط المتجر غير صالح','المرجو التأكد من الرابط المرسل'); return; }
  try{
    // المحاولة 1: من publicStores الآمن
    let snap=await get(ref(db, `publicStores/${STORE_ID}`));
    if(snap.exists()){
      const data=snap.val();
      document.getElementById('storeName').textContent=data.name||'المتجر';
      document.getElementById('storeLogo').textContent=(data.name||'K').charAt(0).toUpperCase();
      products=data.products||[];
      if(products.length===0) showError('هذا المتجر فارغ حاليا','لا توجد منتجات');
      else renderProducts();
      return;
    }
    // Fallback: من users مباشرة إذا القواعد القديمة
    snap=await get(ref(db, `users/${STORE_ID}/products`));
    if(!snap.exists()){ showError('هذا المتجر غير موجود أو لم يعد متاحا',''); return; }
    const val=snap.val(); if(val._init) delete val._init;
    products=Object.values(val).filter(v=>v&&typeof v==='object'&&!v._init&&!v.hidden);
    const profSnap=await get(ref(db, `users/${STORE_ID}/profile`));
    if(profSnap.exists()){ const p=profSnap.val(); document.getElementById('storeName').textContent=p.storeName||p.displayName||'المتجر'; document.getElementById('storeLogo').textContent=(p.storeName||'K').charAt(0).toUpperCase(); }
    renderProducts();
  }catch(error){
    console.error('store.html load error:', error);
    if(String(error.message).includes('Permission denied')||String(error).includes('PERMISSION_DENIED')){
      showError('المتجر غير متاح حاليا','صاحب المتجر لم يفعل المتجر العام بعد أو قواعد Firebase غير محدثة');
    } else {
      showError('حدث خطأ','حاول مرة أخرى لاحقا');
    }
  }
}
function renderProducts(){
  const q=document.getElementById('searchInput').value.toLowerCase().trim();
  let list=products; if(q) list=list.filter(p=>(p.name||'').toLowerCase().includes(q));
  document.getElementById('productsContainer').innerHTML=list.map(p=>{
    const img=escapeHtml(p.mainImage||p.images?.[0]||'https://via.placeholder.com/300');
    const inCart=cart.find(c=>c.productId==p.id);
    return `<div class="bg-white rounded-2xl border overflow-hidden"><div class="relative bg-gray-50"><img src="${img}" class="w-full h-48 object-cover"><span class="absolute top-2 left-2 bg-emerald-600 text-white text-xs w-6 h-6 rounded-full ${inCart?'flex':'hidden'} items-center justify-center">${inCart?inCart.qty:''}</span></div><div class="p-3"><h3 class="font-bold text-[13px] text-center line-clamp-1 mb-1">${escapeHtml(p.name)}</h3><p class="font-bold text-emerald-600 text-center text-sm mb-2">${parseFloat(p.price||0).toFixed(2)} درهم</p><button onclick="openQty('${escapeHtml(p.id)}')" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl font-bold text-xs">إضافة للطلب</button></div></div>`;
  }).join('');
}
document.getElementById('searchInput').addEventListener('input', renderProducts);
window.openQty=function(id){const p=products.find(x=>x.id==id); if(!p)return; currentProduct=p; document.getElementById('qtyImg').src=p.mainImage||''; document.getElementById('qtyName').textContent=p.name; document.getElementById('qtyPrice').textContent=parseFloat(p.price||0).toFixed(2); document.getElementById('qtyStock').textContent=p.stock||0; document.getElementById('qtyInput').value=cart.find(c=>c.productId==id)?.qty||1; document.getElementById('qtyModal').classList.add('active');}
window.closeQtyModal=function(){document.getElementById('qtyModal').classList.remove('active');}
window.changeModalQty=function(d){let v=parseInt(document.getElementById('qtyInput').value)||0; v+=d; if(v<1)v=1; document.getElementById('qtyInput').value=v;}
window.confirmAddToCart=function(){const qty=parseInt(document.getElementById('qtyInput').value)||0; if(qty<=0||!currentProduct)return; if(qty>(parseInt(currentProduct.stock)||999999)){ alert('الكمية أكبر من المخزون'); return;} const idx=cart.findIndex(c=>c.productId==currentProduct.id); if(idx>-1)cart[idx].qty=qty; else cart.push({productId:currentProduct.id,name:currentProduct.name,price:currentProduct.price,qty,mainImage:currentProduct.mainImage}); closeQtyModal(); updateCartUI(); renderProducts();}
function updateCartUI(){const c=cart.reduce((s,i)=>s+i.qty,0); const tot=cart.reduce((s,i)=>s+(parseFloat(i.price)||0)*i.qty,0); document.getElementById('cartCount').textContent=c; document.getElementById('cartCount').classList.toggle('hidden',c===0); document.getElementById('cartItemsCount').textContent=c; document.getElementById('cartTotal').textContent=tot.toFixed(2); document.getElementById('cartBar').classList.toggle('hidden',c===0);}
window.openCheckout=function(){if(cart.length===0)return; document.getElementById('cartSummary').innerHTML=cart.map(i=>`<div class="flex justify-between"><span>${escapeHtml(i.name)} × ${i.qty}</span><span class="font-bold">${(i.price*i.qty).toFixed(2)}</span></div>`).join(''); document.getElementById('finalTotal').textContent=cart.reduce((s,i)=>s+i.price*i.qty,0).toFixed(2)+' درهم'; document.getElementById('checkoutModal').classList.add('active');}
window.closeCheckout=function(){document.getElementById('checkoutModal').classList.remove('active');}
window.confirmOrder=async function(){
  const name=document.getElementById('cName').value.trim(), phone=document.getElementById('cPhone').value.trim(), city=document.getElementById('cCity').value.trim(), address=document.getElementById('cAddress').value.trim(), note=document.getElementById('cNote').value.trim(), pay=document.querySelector('input[name="payMethod"]:checked')?.value||'cod';
  if(!name||!phone||!city||!address){ showToast('املأ الحقول الضرورية'); return; }
  const order={clientName:name,phone,address,city,note,items:cart,totalItems:cart.length,totalQty:cart.reduce((s,i)=>s+i.qty,0),totalValue:cart.reduce((s,i)=>s+i.price*i.qty,0),paymentMethod:pay,status:'pending',createdAt:new Date().toISOString(),source:'public_store'};
  try{ const refPush=await push(ref(db, `publicStores/${STORE_ID}/orders`), order); await push(ref(db, `users/${STORE_ID}/orders`), order); document.getElementById('successId').textContent=refPush.key.slice(-6).toUpperCase(); document.getElementById('successTotal').textContent=order.totalValue.toFixed(2)+' درهم'; document.getElementById('successPay').textContent=pay==='cod'?'الدفع عند الاستلام':'الدفع الآن'; document.getElementById('checkoutModal').classList.remove('active'); document.getElementById('successModal').classList.add('active'); cart=[]; updateCartUI(); }catch(e){ console.error('confirmOrder error:', e); showToast('خطأ في الإرسال'); }
}
function showToast(m){const t=document.getElementById('toast'); document.getElementById('toastMessage').textContent=m; t.classList.remove('hidden'); setTimeout(()=>t.classList.add('hidden'),3000);}
document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
